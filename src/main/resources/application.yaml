spring:
  application:
    name: invoice-verification-system

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:invoice_db}
    username: ${DB_USERNAME:invoice_user}
    password: ${DB_PASSWORD:invoice_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 10MB
      # Allow multipart fields and boundaries in addition to a 10 MB document.
      max-request-size: 12MB

aws:
  s3:
     bucket-name: invoice-verification-documents-invoice-image

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brand admin</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/styles.css"><script src="/admin.js" defer></script></head>
<body><main class="layout"><aside class="introduction"><p class="eyebrow"><span class="gold-dash"></span> SECURE AREA</p><h1><span id="brand-name">Brand</span><br><em>admin.</em></h1><p class="intro-copy">Review invoices submitted through your brand’s registration page.</p></aside>
<div class="form-surface"><div class="form-heading"><span>ADMIN DASHBOARD</span><span id="admin-email"></span></div>
<section id="login-panel"><h2>Sign in</h2><p>Use your brand administrator email and password.</p><form id="login-form"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><p id="login-error" class="field-error" hidden></p><button class="primary-button" type="submit">Sign in <span aria-hidden="true">↗</span></button></form></section>
<section id="dashboard" hidden><div class="submit-row"><p><strong id="invoice-count">0</strong><br>submitted invoices</p><div><button class="primary-button" id="refresh" type="button">Refresh <span aria-hidden="true">↗</span></button> <button id="logout" type="button">Log out</button></div></div><div class="field"><label for="invoice-search">Search invoices</label><input id="invoice-search" type="search" placeholder="Invoice number, customer or email"></div><div id="dashboard-error" class="notice notice-error" hidden></div><div id="invoice-list" aria-live="polite"></div></section>
</div></main></body></html>
